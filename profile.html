<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي | ليالي إسطنبول</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif;
  min-height:100vh;
}

a{
  color:inherit;
  text-decoration:none;
}

.header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid rgba(212,175,55,.25);
  background:#080808;
}

.logo{
  color:#d4af37;
  font-size:20px;
  font-weight:bold;
}

.back{
  color:#d4af37;
  border:1px solid rgba(212,175,55,.45);
  padding:9px 15px;
  border-radius:25px;
  font-size:14px;
}

.container{
  width:min(100%,900px);
  margin:auto;
  padding:25px 16px 60px;
}

.loading,
.error{
  text-align:center;
  padding:60px 20px;
  color:#d4af37;
}

/* الصورة الرئيسية */
.main-photo{
  position:relative;
  width:100%;
  max-height:650px;
  border-radius:20px;
  overflow:hidden;
  background:#111;
  cursor:pointer;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.main-photo img{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:cover;
}

/* معلومات البروفايل */
.info{
  padding:24px 5px;
}

.name{
  font-size:30px;
  color:#d4af37;
  margin-bottom:8px;
}

.age{
  color:#ddd;
  font-size:17px;
  margin-bottom:18px;
}

.bio{
  color:#ccc;
  line-height:1.9;
  font-size:16px;
  white-space:pre-line;
}

.whatsapp{
  display:inline-block;
  margin-top:22px;
  background:#d4af37;
  color:#080808;
  padding:13px 25px;
  border-radius:30px;
  font-weight:bold;
}

/* الصور المصغرة */
.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
}

.thumb{
  aspect-ratio:1/1;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  border:2px solid transparent;
  background:#111;
}

.thumb.active{
  border-color:#d4af37;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* نافذة تكبير الصورة */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:95vw;
  max-height:88vh;
  object-fit:contain;
  border-radius:10px;
}

.close{
  position:absolute;
  top:18px;
  right:20px;
  width:45px;
  height:45px;
  border:1px solid #d4af37;
  border-radius:50%;
  background:#111;
  color:#d4af37;
  font-size:27px;
  cursor:pointer;
}

.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid #d4af37;
  background:rgba(0,0,0,.7);
  color:#d4af37;
  font-size:25px;
  cursor:pointer;
}

.prev{
  left:18px;
}

.next{
  right:18px;
}

.counter{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:#d4af37;
  font-size:14px;
}

@media(max-width:600px){
  .header{
    height:65px;
  }

  .name{
    font-size:25px;
  }

  .gallery{
    grid-template-columns:repeat(3,1fr);
  }

  .nav{
    width:42px;
    height:42px;
  }

  .prev{
    left:8px;
  }

  .next{
    right:8px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">ليالي إسطنبول</div>
  <a class="back" href="index.html#profiles">← العودة</a>
</header>

<main class="container">

  <div id="loading" class="loading">
    جاري تحميل الملف...
  </div>

  <div id="profile" style="display:none;">

    <div class="main-photo" onclick="openLightbox(0)">
      <img id="mainImage" src="" alt="">
    </div>

    <div id="gallery" class="gallery"></div>

    <section class="info">
      <h1 id="name" class="name"></h1>
      <div id="age" class="age"></div>
      <div id="bio" class="bio"></div>
      <a id="whatsapp" class="whatsapp" href="#" target="_blank">
        تواصل عبر واتساب
      </a>
    </section>

  </div>

  <div id="error" class="error" style="display:none;">
    تعذر تحميل الملف الشخصي.
  </div>

</main>

<!-- نافذة الصور -->
<div id="lightbox" class="lightbox">

  <button class="close" onclick="closeLightbox()">×</button>

  <button class="nav prev" onclick="previousImage()">‹</button>

  <img id="lightboxImage" src="" alt="">

  <button class="nav next" onclick="nextImage()">›</button>

  <div id="counter" class="counter"></div>

</div>

<script>

const SUPABASE_URL =
"https://edeczxsfhijkdglyrwqk.supabase.co";

/*
  ضع هنا Publishable Key الخاص بمشروعك
  الذي حفظته سابقًا.
*/
const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_2RrItkJ4-M2JysNR8gOZZQ_Mo4GvpqC";

let images = [];
let currentIndex = 0;


/* استخراج slug من الرابط */
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");


async function loadProfile(){

  if(!slug){
    showError();
    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?select=*&slug=eq." +
      encodeURIComponent(slug) +
      "&active=eq.true&limit=1",
      {
        headers:{
          "apikey":SUPABASE_PUBLISHABLE_KEY,
          "Authorization":"Bearer " + SUPABASE_PUBLISHABLE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("Profile request failed");
    }

    const data = await response.json();

    if(!data.length){
      showError();
      return;
    }

    renderProfile(data[0]);

  }catch(error){

    console.error(error);
    showError();

  }

}


function renderProfile(profile){

  document.getElementById("loading").style.display="none";
  document.getElementById("profile").style.display="block";

  document.getElementById("name").textContent =
    profile.name_ar || profile.name_en || "";

  if(profile.age){
    document.getElementById("age").textContent =
      profile.age + " سنة";
  }

  document.getElementById("bio").textContent =
    profile.bio_ar || profile.bio_en || "";

  /* تجهيز الصور */

  images = [];

  if(profile.image_url){
    images.push(profile.image_url);
  }

  if(profile.gallery){

    let gallery = profile.gallery;

    if(typeof gallery === "string"){
      try{
        gallery = JSON.parse(gallery);
      }catch(e){
        gallery = [];
      }
    }

    if(Array.isArray(gallery)){

      gallery.forEach(url => {

        if(
          url &&
          typeof url === "string" &&
          !images.includes(url)
        ){
          images.push(url);
        }

      });

    }

  }

  if(images.length){

    document.getElementById("mainImage").src = images[0];

    renderGallery();

  }else{

    document.getElementById("mainImage").style.display="none";

  }


  /* واتساب */

  if(profile.whatsapp){

    let phone = String(profile.whatsapp)
      .replace(/\D/g,"");

    const message =
      "مرحباً، أريد التواصل بخصوص " +
      (profile.name_ar || profile.name_en || "البروفايل");

    document.getElementById("whatsapp").href =
      "https://wa.me/" +
      phone +
      "?text=" +
      encodeURIComponent(message);

  }else{

    document.getElementById("whatsapp").style.display="none";

  }

}


function renderGallery(){

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML="";

  images.forEach((url,index)=>{

    const div =
      document.createElement("div");

    div.className =
      "thumb" +
      (index === 0 ? " active" : "");

    div.onclick = () => {

      setMainImage(index);

    };

    const img =
      document.createElement("img");

    img.src = url;
    img.alt = "صورة " + (index + 1);

    div.appendChild(img);
    gallery.appendChild(div);

  });

}


function setMainImage(index){

  if(!images[index]) return;

  currentIndex = index;

  document.getElementById("mainImage").src =
    images[index];

  document
    .querySelectorAll(".thumb")
    .forEach((thumb,i)=>{

      thumb.classList.toggle(
        "active",
        i === index
      );

    });

}


function openLightbox(index){

  if(!images.length) return;

  currentIndex = index;

  document.getElementById("lightboxImage").src =
    images[currentIndex];

  updateCounter();

  document
    .getElementById("lightbox")
    .classList.add("open");

  document.body.style.overflow="hidden";

}


function closeLightbox(){

  document
    .getElementById("lightbox")
    .classList.remove("open");

  document.body.style.overflow="";

}


function nextImage(){

  if(!images.length) return;

  currentIndex =
    (currentIndex + 1) % images.length;

  document.getElementById("lightboxImage").src =
    images[currentIndex];

  updateCounter();

  setMainImage(currentIndex);

}


function previousImage(){

  if(!images.length) return;

  currentIndex =
    (currentIndex - 1 + images.length) %
    images.length;

  document.getElementById("lightboxImage").src =
    images[currentIndex];

  updateCounter();

  setMainImage(currentIndex);

}


function updateCounter(){

  document.getElementById("counter").textContent =
    (currentIndex + 1) +
    " / " +
    images.length;

}


function showError(){

  document.getElementById("loading").style.display="none";

  document.getElementById("error").style.display="block";

}


/* إغلاق عند الضغط خارج الصورة */
document
  .getElementById("lightbox")
  .addEventListener("click",function(e){

    if(e.target === this){
      closeLightbox();
    }

  });


/* الأسهم من لوحة المفاتيح */
document.addEventListener("keydown",function(e){

  if(e.key === "Escape"){
    closeLightbox();
  }

  if(e.key === "ArrowRight"){
    nextImage();
  }

  if(e.key === "ArrowLeft"){
    previousImage();
  }

});


loadProfile();

</script>

</body>
</html>
