<script>
const SUPABASE_URL="https://edeczxsfhijkdglyrwqk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_2RrItkJ4-M2JysNR8gOZZQ_Mo4GvpqC";

const returningFromProfile =
  new URLSearchParams(location.search).get("return")==="profiles";

if(returningFromProfile){
  document.body.style.visibility="hidden";
}

let profilesLoaded=false;
let loadingProfiles=false;

async function loadProfiles(){

  if(profilesLoaded || loadingProfiles) return;

  const grid=document.getElementById("profilesGrid");
  if(!grid) return;

  loadingProfiles=true;

  try{

    if(SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR")){
      grid.innerHTML=
      '<div class="profile-card" style="grid-column:1/-1;padding:30px;text-align:center;color:#aaa">سيتم عرض البروفايلات بعد ربط Supabase.</div>';

      loadingProfiles=false;
      return;
    }

    const res=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?select=*&active=eq.true&order=created_at.desc",
      {
        headers:{
          "apikey":SUPABASE_PUBLISHABLE_KEY,
          "Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY
        }
      }
    );

    if(!res.ok)
      throw new Error("Supabase request failed");

    const profiles=await res.json();

    if(!profiles.length){

      grid.innerHTML=
      '<div class="profile-card" style="grid-column:1/-1;padding:30px;text-align:center;color:#aaa">لا توجد بروفايلات منشورة حاليًا.</div>';

      profilesLoaded=true;
      loadingProfiles=false;

      finishReturn();

      return;
    }

    const lang=
      localStorage.getItem("istanbulNightsLanguage")==="en"
      ?"en"
      :"ar";

    grid.innerHTML=profiles.map(p=>{

      const name=
        lang==="en"
        ?(p.name_en||p.name_ar)
        :(p.name_ar||p.name_en);

      const bio=
        lang==="en"
        ?(p.bio_en||p.bio_ar)
        :(p.bio_ar||p.bio_en);

      const photo=
        p.image_url||
        ((Array.isArray(p.gallery)&&p.gallery[0])||"");

      const wa=
        (p.whatsapp||"").replace(/[^0-9]/g,"");

      const msg=
        lang==="en"
        ?`Hello, I would like to contact ${name} from Istanbul Nights.`
        :`مرحبًا، أريد التواصل مع ${name} من ليالي إسطنبول.`;

      const waUrl=
        wa
        ?`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`
        :"#";

      return `
      <article class="profile-card">

        <a href="profile.html?slug=${encodeURIComponent(p.slug)}">

          <div class="profile-photo">
            <img
              src="${photo}"
              alt="${name}"
              loading="lazy">
          </div>

        </a>

        <div class="profile-info">

          <div class="profile-name">
            ${name}
          </div>

          <div class="profile-age">
            ${p.age?p.age+" • ":""}Istanbul
          </div>

          <div class="profile-text">
            ${bio||""}
          </div>

          <div class="profile-actions">

            <a
              class="profile-btn"
              href="profile.html?slug=${encodeURIComponent(p.slug)}">
              ${lang==="en"?"View Profile":"عرض البروفايل"}
            </a>

            <a
              class="profile-btn profile-secondary"
              href="${waUrl}"
              target="_blank"
              rel="noopener">
              ${lang==="en"?"WhatsApp":"واتساب"}
            </a>

          </div>

        </div>

      </article>
      `;

    }).join("");

    profilesLoaded=true;
    loadingProfiles=false;

    finishReturn();

  }catch(e){

    console.error(e);

    grid.innerHTML=
    '<div class="profile-card" style="grid-column:1/-1;padding:30px;text-align:center;color:#aaa">تعذر تحميل البروفايلات الآن.</div>';

    loadingProfiles=false;

    finishReturn();
  }
}


function finishReturn(){

  if(!returningFromProfile){
    document.body.style.visibility="visible";
    return;
  }

  requestAnimationFrame(()=>{

    const section=document.getElementById("profiles");

    if(section){

      window.scrollTo(
        0,
        section.getBoundingClientRect().top+
        window.scrollY
      );

    }

    requestAnimationFrame(()=>{

      document.body.style.visibility="visible";

      history.replaceState(
        null,
        "",
        window.location.pathname
      );

    });

  });

}


function setLanguage(language){

  document.documentElement.lang=language;

  document.documentElement.dir=
    language==="ar"?"rtl":"ltr";

  document.querySelectorAll("[data-i18n]").forEach(el=>{

    const key=el.dataset.i18n;

    if(translations[language][key])
      el.innerHTML=translations[language][key];

  });

  document
    .getElementById("arBtn")
    .classList.toggle("active",language==="ar");

  document
    .getElementById("enBtn")
    .classList.toggle("active",language==="en");

  localStorage.setItem(
    "istanbulNightsLanguage",
    language
  );

  /*
    لا نعيد تحميل البروفايلات هنا.
    هذا كان أحد أسباب المشكلة.
  */
}


function openMenu(){
  document
    .getElementById("mobileMenu")
    .classList.add("open");
}

function closeMenu(){
  document
    .getElementById("mobileMenu")
    .classList.remove("open");
}


document.addEventListener("DOMContentLoaded",()=>{

  setLanguage(
    localStorage.getItem("istanbulNightsLanguage")==="en"
    ?"en"
    :"ar"
  );

  loadProfiles();

});
</script>
